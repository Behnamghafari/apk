<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font:13px system-ui}button,input,select,textarea{background:#17243a;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:7px;min-width:0}button{background:#1d4ed8}.top,.tabs{display:flex;gap:5px;padding:7px;overflow:auto;border-bottom:1px solid #334155}.top input{flex:1}.tabs button{white-space:nowrap}.tabs .on{background:#1d4ed8}.pane{display:none;padding:8px;height:calc(100vh - 94px);overflow:auto}.pane.on{display:block}.row{display:flex;gap:5px;margin-bottom:6px}.row>*{flex:1}.entry{padding:7px;border-bottom:1px solid #334155;overflow-wrap:anywhere}.muted{color:#94a3b8}.auth{color:#fbbf24;font-weight:bold}.section{color:#93c5fd;margin:10px 0 5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080f1d;padding:8px;max-height:180px;overflow:auto}textarea{width:100%;min-height:65px}.wide{width:100%}
</style></head><body>
<div class="top"><input id="siteUrl" placeholder="https://website.com"><button onclick="NativeTools.open(siteUrl.value)">OPEN</button></div>
<div class="tabs"><button class="on" data-t="network">Network</button><button data-t="console">Console</button><button data-t="elements">Elements</button><button data-t="application">Application</button><button data-t="sources">Sources</button><button data-t="performance">Performance</button><button data-t="api">API Tester</button></div>
<section id="network" class="pane on"><div class="row"><input id="filter" placeholder="Filter URL / header" oninput="renderNet()"><button onclick="net.length=0;renderNet()">Clear</button></div><label><input type="checkbox" id="authOnly" onchange="renderNet()"> Authorization only</label><div id="netList"></div><div id="detail"></div></section>
<section id="console" class="pane"><button onclick="logs.length=0;renderLogs()">Clear</button><div id="logList"></div></section>
<section id="elements" class="pane"><button onclick="NativeTools.inspect('dom')">Inspect DOM</button><pre id="dom"></pre></section>
<section id="application" class="pane"><button onclick="NativeTools.inspect('storage')">Read Storage</button><button onclick="NativeTools.clearData()">Clear site data</button><pre id="storage"></pre></section>
<section id="sources" class="pane"><button onclick="NativeTools.inspect('sources')">Loaded resources</button><pre id="sourcesView"></pre></section>
<section id="performance" class="pane"><button onclick="NativeTools.inspect('sources')">Refresh timing</button><pre id="perf"></pre></section>
<section id="api" class="pane"><div class="row"><select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select><input id="apiUrl" placeholder="https://api.example.com"></div><div class="section">Headers · JSON</div><textarea id="headers">{"Accept":"application/json","Content-Type":"application/json"}</textarea><div class="section">Authorization</div><div class="row"><select id="auth"><option value="none">None</option><option value="bearer">Bearer</option><option value="basic">Basic</option><option value="custom">Custom</option></select><input id="token" placeholder="Token or username:password"></div><div class="section">Body</div><select id="ctype" class="wide"><option>application/json</option><option>application/x-www-form-urlencoded</option><option>text/plain</option><option>application/xml</option></select><textarea id="body" placeholder='{"hello":"world"}'></textarea><button class="wide" onclick="sendApi()">SEND REQUEST</button><div id="status" class="section">Response</div><pre id="response"></pre><div class="section">History</div><div id="history"></div></section>
<script>
const net=[],logs=[],hist=[];let seq=0;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===b.dataset.t))});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function receive(k,d){if(k==='network'){net.push(d);renderNet()}if(k==='console'){logs.push(d);renderLogs()}if(k==='inspect'){let id={dom:'dom',storage:'storage',sources:'sourcesView'}[d.kind];if(id)document.getElementById(id).textContent=pretty(d.value);if(d.kind==='sources')document.getElementById('perf').textContent=pretty(d.value)}}
function pretty(s){try{return JSON.stringify(JSON.parse(s),null,2)}catch(e){return String(s)}}
function renderNet(){let q=filter.value.toLowerCase();let rows=net.map((r,i)=>({...r,i})).filter(r=>(!authOnly.checked||Object.keys(r.headers||{}).some(k=>k.toLowerCase()==='authorization'))&&JSON.stringify(r).toLowerCase().includes(q));netList.innerHTML=rows.slice().reverse().map(r=>'<div class="entry" onclick="show('+r.i+')"><b>'+esc(r.method||'GET')+'</b> '+esc(r.status||r.phase||'')+' '+(Object.keys(r.headers||{}).some(k=>k.toLowerCase()==='authorization')?'<span class="auth">🔑 AUTH</span>':'')+'<br>'+esc(r.url)+'<br><small class="muted">'+esc(r.source||'')+'</small></div>').join('')}
function show(i){let r=net[i];detail.innerHTML='<div class="section">Request details</div><pre>'+esc(JSON.stringify(r,null,2))+'</pre><div class="section">Request headers</div><pre>'+Object.entries(r.headers||{}).map(([k,v])=>(k.toLowerCase()==='authorization'?'🔑 ':'')+k+': '+v).map(esc).join('\n')+'</pre><div class="section">Response headers</div><pre>'+esc(JSON.stringify(r.responseHeaders||{},null,2))+'</pre>'}
function renderLogs(){logList.innerHTML=logs.slice(-200).reverse().map(x=>'<div class="entry"><b>'+esc(x.level)+'</b> '+esc(x.message)+'<small class="muted"><br>'+esc(x.source||'')+':'+esc(x.line||'')+'</small></div>').join('')}
function sendApi(){let h;try{h=JSON.parse(headers.value||'{}')}catch(e){alert('Headers JSON invalid');return}let a=auth.value,t=token.value;if(a==='bearer')h.Authorization='Bearer '+t;if(a==='basic')h.Authorization='Basic '+btoa(t);if(a==='custom')h.Authorization=t;let id=String(++seq),d={id,url:apiUrl.value,method:method.value,headers:h,body:body.value,contentType:ctype.value};hist.unshift(d);history.innerHTML=hist.slice(0,15).map((x,i)=>'<div class="entry" onclick="restore('+i+')">'+esc(x.method+' '+x.url)+'</div>').join('');status.textContent='Sending…';NativeTools.request(JSON.stringify(d))}
function restore(i){let x=hist[i];method.value=x.method;apiUrl.value=x.url;headers.value=JSON.stringify(x.headers,null,2);body.value=x.body}
function apiResult(raw){let r=JSON.parse(raw);status.textContent=r.error?'Error':'HTTP '+r.status+' · '+r.duration+'ms';response.textContent=r.error||('Response headers\n'+JSON.stringify(r.headers,null,2)+'\n\n'+r.body)}
window.DevToolsUI={receive,apiResult};
</script></body></html>
