name: Build DevTools APK
on:
  push:
    paths:
      - "apps/devtools/**"
      - ".github/workflows/build-devtools.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p apps/devtools :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: devtools-debug-apk
          path: apps/devtools/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
