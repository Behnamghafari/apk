name: Build ApiX APK
on:
  push:
    paths:
      - "apps/behnam-tester/**"
      - ".github/workflows/build-behnam-tester.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apix-latest-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate ApiX HTML and JavaScript
        run: node apps/behnam-tester/scripts/validate-html.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/keys/behnam-tester-debug.keystore.base64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|SHA1:"
      - name: Build debug APK
        run: gradle -p apps/behnam-tester :app:assembleDebug
      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs apps/behnam-tester/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: behnam-tester-debug-apk
          path: apps/behnam-tester/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: behnam-tester-latest
          name: ApiX - Latest Android Build
          body: آخرین نسخه ApiX برای اندروید.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: apps/behnam-tester/app/build/outputs/apk/debug/app-debug.apk
