name: Build ApiX APK
run-name: ApiX Android production build
on:
  push:
    paths:
      - "apps/behnam-tester/**"
      - ".github/workflows/build-behnam-tester.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apix-latest-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate ApiX HTML and JavaScript
        run: node apps/behnam-tester/scripts/validate-html.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/keys/behnam-tester-debug.keystore.base64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|SHA1:"
      - name: Validate and restore production signing key
        id: release-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Repository secrets: %s\\n' "${missing[@]}"
            echo "Add all four secrets in Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/apix-production.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded production keystore is empty. Recreate ANDROID_KEYSTORE_BASE64 from the release-key.jks file."
            exit 1
          fi
          echo "Decoded keystore size: $(wc -c < "$KEYSTORE_PATH") bytes"
          KEYTOOL_LOG="$RUNNER_TEMP/keystore-validation-error.txt"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >"$KEYTOOL_LOG" 2>&1; then
            echo "::error::Keystore could not be opened. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            cat "$KEYTOOL_LOG"
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >"$KEYTOOL_LOG" 2>&1; then
            echo "::error::Keystore opens successfully, but ANDROID_KEY_ALIAS was not found. Set it to apix."
            cat "$KEYTOOL_LOG"
            exit 1
          fi
          echo "Production keystore and alias validated successfully."
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build production APK
        run: gradle -p apps/behnam-tester :app:assembleRelease
      - name: Verify production APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs apps/behnam-tester/app/build/outputs/apk/release/app-release.apk
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: apix-production-apk
          path: apps/behnam-tester/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Build debug APK
        run: gradle -p apps/behnam-tester :app:assembleDebug
      - name: Run Android Lint
        run: gradle -p apps/behnam-tester :app:lintDebug
      - name: Verify debug APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs apps/behnam-tester/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apix-debug-apk
          path: apps/behnam-tester/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish production APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: behnam-tester-latest
          name: ApiX - Latest Android Build
          body: نسخه انتشار امضاشده ApiX برای نصب و توزیع.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: apps/behnam-tester/app/build/outputs/apk/release/app-release.apk
