name: Build Behnam Tester APK
on:
  push:
    paths:
      - "apps/behnam-tester/**"
      - ".github/workflows/build-behnam-tester.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/keys/behnam-tester-debug.keystore.base64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build debug APK
        run: gradle -p apps/behnam-tester :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: behnam-tester-debug-apk
          path: apps/behnam-tester/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: behnam-tester-latest
          name: بهنام تستر - آخرین نسخه
          body: آخرین نسخه آزمایشی بهنام تستر برای اندروید.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: apps/behnam-tester/app/build/outputs/apk/debug/app-debug.apk
