name: Build ApiX Native APK
run-name: ApiX Native Android debug build
on:
  push:
    paths:
      - "apps/apix-native/**"
      - ".github/workflows/build-apix-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build ApiX Native debug APK
        run: gradle -p apps/apix-native :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apix-native-debug-apk
          path: apps/apix-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
